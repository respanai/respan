[tool.poetry]
name = "respan-exporter-llamaindex"
version = "1.0.0"
description = "Respan exporter for LlamaIndex traces"
authors = ["Respan <team@respan.ai>"]
readme = "README.md"
packages = [{include = "respan_exporter_llamaindex", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
requests = "^2.32.5"
llama-index-core = ">=0.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
