[tool.poetry]
name = "respan-instrumentation-openlit"
version = "0.1.0"
description = "Respan instrumentation plugin for OpenLIT"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_openlit", from = "./src" },
]
include = [
    "src/respan_instrumentation_openlit/_pricing.json",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
openlit = ">=1.44.0,<2.0.0"
opentelemetry-api = ">=1.38.0,<2.0.0"
opentelemetry-sdk = ">=1.38.0,<2.0.0"
opentelemetry-semantic-conventions-ai = ">=0.4.1"
respan-sdk = ">=2.6.1"
respan-tracing = "^2.17.0"

[tool.poetry.plugins."respan.instrumentations"]
openlit = "respan_instrumentation_openlit:OpenLITInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
