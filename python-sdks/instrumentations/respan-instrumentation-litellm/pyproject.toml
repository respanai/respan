[tool.poetry]
name = "respan-instrumentation-litellm"
version = "0.1.0"
description = "Respan instrumentation plugin for LiteLLM"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_litellm", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.7.6"
litellm = ">=1.80.10"
opentelemetry-semantic-conventions-ai = ">=0.5.1"
opentelemetry-semantic-conventions = ">=0.59b0"

[tool.poetry.plugins."respan.instrumentations"]
litellm = "respan_instrumentation_litellm:LiteLLMInstrumentor"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
respan-instrumentation-openai = "^1.2.0"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
