[tool.poetry]
name = "respan-instrumentation-elasticsearch"
version = "0.1.0"
description = "Respan instrumentation plugin for Elasticsearch"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_elasticsearch", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.6.26"
elasticsearch = ">=8.13.0,<10.0.0"
elastic-transport = ">=8.13.0,<10.0.0"
opentelemetry-semantic-conventions-ai = ">=0.5.1,<0.6"
wrapt = ">=1.16.0"

[tool.poetry.plugins."respan.instrumentations"]
elasticsearch = "respan_instrumentation_elasticsearch:ElasticsearchInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires an Elasticsearch server)",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
pytest-asyncio = ">=0.24.0,<2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
