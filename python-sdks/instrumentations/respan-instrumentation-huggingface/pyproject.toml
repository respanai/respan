[tool.poetry]
name = "respan-instrumentation-huggingface"
version = "0.1.0"
description = "Respan instrumentation plugin for Hugging Face Transformers"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_huggingface", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = ">=2.17.0,<3"
respan-sdk = ">=2.6.26"
opentelemetry-api = ">=1.38.0"
opentelemetry-sdk = ">=1.38.0"
opentelemetry-semantic-conventions = ">=0.59b0"
opentelemetry-semantic-conventions-ai = ">=0.5.1,<0.6"
opentelemetry-instrumentation-transformers = ">=0.61.0"
transformers = ">=4.45.0"

[tool.poetry.plugins."respan.instrumentations"]
huggingface = "respan_instrumentation_huggingface:HuggingFaceInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
