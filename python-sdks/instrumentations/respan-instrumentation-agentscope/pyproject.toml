[tool.poetry]
name = "respan-instrumentation-agentscope"
version = "0.1.0"
description = "Respan instrumentation plugin for AgentScope"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_agentscope", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.16.1"
respan-sdk = ">=2.5.0"
agentscope = ">=2.0.3,<3.0.0"
opentelemetry-semantic-conventions-ai = ">=0.4.1"
opentelemetry-semantic-conventions = ">=0.59b0"

[tool.poetry.plugins."respan.instrumentations"]
agentscope = "respan_instrumentation_agentscope:AgentScopeInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
