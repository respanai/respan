[tool.poetry]
name = "respan-instrumentation-pgvector"
version = "0.1.0"
description = "Respan instrumentation plugin for pgvector with psycopg"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_pgvector", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.6.26"
pgvector = ">=0.3.0,<1.0.0"
psycopg = { version = ">=3.1.12,<4.0.0", extras = ["binary"] }
psycopg2-binary = { version = ">=2.9.9,<3.0.0", optional = true }
opentelemetry-semantic-conventions-ai = ">=0.5.1,<0.6"
wrapt = ">=1.16.0"

[tool.poetry.extras]
psycopg2 = ["psycopg2-binary"]

[tool.poetry.plugins."respan.instrumentations"]
pgvector = "respan_instrumentation_pgvector:PGVectorInstrumentor"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
