[tool.poetry]
name = "respan-instrumentation-writer"
version = "0.1.0"
description = "Respan instrumentation plugin for the Writer Python SDK"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_writer", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.6.1"
writerai = ">=4.0.1"
opentelemetry-semantic-conventions-ai = ">=0.4.1"

[tool.poetry.plugins."respan.instrumentations"]
writer = "respan_instrumentation_writer:WriterInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
