[tool.poetry]
name = "respan-instrumentation-watson-orchestrate-adk"
version = "0.1.0"
description = "Respan instrumentation plugin for IBM watsonx Orchestrate ADK"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_watson_orchestrate_adk", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.6.1"
ibm-watsonx-orchestrate = ">=2.12.0,<3.0.0"
opentelemetry-semantic-conventions-ai = ">=0.4.1"
opentelemetry-semantic-conventions = ">=0.59b0"

[tool.poetry.plugins."respan.instrumentations"]
watson-orchestrate-adk = "respan_instrumentation_watson_orchestrate_adk:WatsonOrchestrateADKInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
