[tool.poetry]
name = "respan-instrumentation-langfuse"
version = "1.0.1"
description = "OTEL-compliant instrumentation for Langfuse to send traces to Respan"
authors = ["Respan <team@respan.ai>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "respan_instrumentation_langfuse", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.19.2"
respan-sdk = ">=2.7.4"
opentelemetry-semantic-conventions-ai = ">=0.4.1"
opentelemetry-api = "^1.39.1"
opentelemetry-sdk = "^1.39.1"
opentelemetry-instrumentation = ">=0.60b1,<1.0.0"
opentelemetry-exporter-otlp-proto-http = "^1.39.1"
langfuse = ">=3.12.0,<5.0.0"
wrapt = ">=1.17.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
black = "^25.12.0"
ruff = "^0.14.13"
dotenv = "^0.9.9"

[tool.poetry.plugins."opentelemetry_instrumentor"]
langfuse = "respan_instrumentation_langfuse.instrumentor:LangfuseInstrumentor"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
