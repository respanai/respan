[tool.poetry]
name = "respan-instrumentation-agentspec"
version = "0.1.0"
description = "Respan instrumentation plugin for AgentSpec"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_agentspec", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.20.0"
respan-sdk = ">=2.5.0"
pyagentspec = ">=26.1.0,<27.0.0"
opentelemetry-semantic-conventions-ai = ">=0.5.1"
opentelemetry-semantic-conventions = ">=0.59b0"
respan-instrumentation-openinference = ">=1.2.2"
openinference-instrumentation-agentspec = ">=0.1.0"

[tool.poetry.plugins."respan.instrumentations"]
agentspec = "respan_instrumentation_agentspec:AgentSpecInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
