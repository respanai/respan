[tool.poetry]
name = "respan-instrumentation-strands-agents"
version = "0.1.0"
description = "Respan instrumentation plugin for Strands Agents"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_strands_agents", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = ">=2.20.0"
respan-sdk = ">=2.7.6"
strands-agents = { version = ">=1.20.0,<2.0.0", extras = ["openai"] }
opentelemetry-semantic-conventions = ">=0.60b0,<1"
opentelemetry-semantic-conventions-ai = ">=0.5.1,<0.6.0"

[tool.poetry.plugins."respan.instrumentations"]
strands-agents = "respan_instrumentation_strands_agents:StrandsAgentsInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
