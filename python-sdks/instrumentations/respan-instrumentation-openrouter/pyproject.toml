[tool.poetry]
name = "respan-instrumentation-openrouter"
version = "0.1.0"
description = "Respan instrumentation plugin for OpenRouter's OpenAI-compatible Python usage"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_openrouter", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.6.26"
respan-instrumentation-openai = ">=1.0.0"
openai = ">=1.0.0"
opentelemetry-semantic-conventions-ai = ">=0.4.1"

[tool.poetry.plugins."respan.instrumentations"]
openrouter = "respan_instrumentation_openrouter:OpenRouterInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
