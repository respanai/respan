[tool.poetry]
name = "respan-instrumentation-aws-bedrock"
version = "0.1.0"
description = "Respan instrumentation plugin for AWS Bedrock Runtime"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_aws_bedrock", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.6.1"
# Optional: the instrumentor lazy-imports boto3 and no-ops when it is absent, so
# the app brings its own boto3. Install with the SDK via the `instruments` extra.
boto3 = { version = ">=1.34.0", optional = true }
opentelemetry-semantic-conventions-ai = ">=0.4.1"

[tool.poetry.extras]
instruments = ["boto3"]

[tool.poetry.plugins."respan.instrumentations"]
aws-bedrock = "respan_instrumentation_aws_bedrock:AWSBedrockInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires AWS credentials)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
