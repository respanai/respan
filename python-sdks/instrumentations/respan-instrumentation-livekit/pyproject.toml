[tool.poetry]
name = "respan-instrumentation-livekit"
version = "0.1.2"
description = "Respan instrumentation plugin for LiveKit Agents"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_livekit", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.7.0"
livekit-agents = ">=1.6.0,<2"
opentelemetry-semantic-conventions-ai = ">=0.5.1,<0.6.0"

[tool.poetry.plugins."respan.instrumentations"]
livekit = "respan_instrumentation_livekit:LiveKitInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
