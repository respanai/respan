[tool.poetry]
name = "respan-instrumentation-cohere"
version = "0.1.0"
description = "Respan instrumentation plugin for Cohere"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_cohere", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.6.1"
cohere = ">=5.0.0,<6"
opentelemetry-instrumentation-cohere = ">=0.60.0"
opentelemetry-semantic-conventions-ai = ">=0.5.1,<0.6.0"

[tool.poetry.plugins."respan.instrumentations"]
cohere = "respan_instrumentation_cohere:CohereInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
