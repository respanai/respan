[tool.poetry]
name = "respan-instrumentation-browser-use"
version = "0.1.1"
description = "Respan instrumentation plugin for browser-use agents"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_browser_use", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
browser-use = ">=0.13.0,<0.14.0"
respan-tracing = ">=2.21.1,<3.0.0"
respan-sdk = ">=2.7.6"
opentelemetry-api = ">=1.38.0,<2.0.0"
opentelemetry-semantic-conventions-ai = ">=0.4.1"
opentelemetry-semantic-conventions = ">=0.59b0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"

[tool.poetry.plugins."respan.instrumentations"]
browser-use = "respan_instrumentation_browser_use:BrowserUseInstrumentor"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: live browser + LLM tests (requires API keys and Chrome)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
