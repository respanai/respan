[tool.poetry]
name = "respan-instrumentation-dspy"
version = "0.1.0"
description = "Respan instrumentation plugin for DSPy"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_dspy", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.16.1"
respan-sdk = ">=2.7.6"
dspy = ">=3.0.0,<4.0.0"
opentelemetry-semantic-conventions-ai = ">=0.5.1"
opentelemetry-semantic-conventions = ">=0.59b0"

[tool.poetry.plugins."respan.instrumentations"]
dspy = "respan_instrumentation_dspy:DSPyInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
