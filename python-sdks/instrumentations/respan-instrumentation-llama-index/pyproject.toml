[tool.poetry]
name = "respan-instrumentation-llama-index"
version = "0.1.0"
description = "Respan instrumentation plugin for LlamaIndex"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_llama_index", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.6.1"
llama-index-core = ">=0.14.23,<1.0"
llama-index-workflows = ">=2.14.0,<3"
llama-index-instrumentation = ">=0.4.3"
opentelemetry-semantic-conventions-ai = ">=0.4.1"

[tool.poetry.plugins."respan.instrumentations"]
llama-index = "respan_instrumentation_llama_index:LlamaIndexInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
