[tool.poetry]
name = "respan-instrumentation-marqo"
version = "0.1.0"
description = "Respan instrumentation plugin for Marqo"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_marqo", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.6.1"
marqo = ">=3.5.1,<4.0.0"
opentelemetry-semantic-conventions-ai = ">=0.4.1"
wrapt = ">=1.16.0"

[tool.poetry.plugins."respan.instrumentations"]
marqo = "respan_instrumentation_marqo:MarqoInstrumentor"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
