[tool.poetry]
name = "respan-instrumentation-google-genai"
version = "0.1.0"
description = "Respan instrumentation plugin for Google Gen AI"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_google_genai", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.6.1"
# Optional: the instrumentor lazy-imports google-genai and no-ops when it is
# absent, so the app brings its own. Install with the SDK via the `instruments` extra.
google-genai = { version = ">=1.0.0", optional = true }
opentelemetry-semantic-conventions-ai = ">=0.4.1"

[tool.poetry.extras]
instruments = ["google-genai"]

[tool.poetry.plugins."respan.instrumentations"]
google-genai = "respan_instrumentation_google_genai:GoogleGenAIInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
