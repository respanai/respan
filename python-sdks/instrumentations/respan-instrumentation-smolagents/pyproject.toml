[tool.poetry]
name = "respan-instrumentation-smolagents"
version = "0.1.1"
description = "Respan instrumentation plugin for smolagents"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_smolagents", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.16.1"
respan-sdk = ">=2.7.6"
smolagents = ">=1.24.0"
opentelemetry-semantic-conventions-ai = ">=0.5.1"
opentelemetry-semantic-conventions = ">=0.59b0"

[tool.poetry.plugins."respan.instrumentations"]
smolagents = "respan_instrumentation_smolagents:SmolagentsInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
