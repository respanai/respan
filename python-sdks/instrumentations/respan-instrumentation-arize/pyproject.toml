[tool.poetry]
name = "respan-instrumentation-arize"
version = "0.1.0"
description = "Respan instrumentation plugin for the Arize Python SDK"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_arize", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
arize = ">=8.35.0"
opentelemetry-semantic-conventions-ai = ">=0.4.1"
respan-sdk = ">=2.6.1"
respan-tracing = "^2.17.0"

[tool.poetry.plugins."respan.instrumentations"]
arize = "respan_instrumentation_arize:ArizeInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
