[tool.poetry]
name = "respan-instrumentation-openai"
version = "1.2.0"
description = "Respan instrumentation plugin for direct OpenAI SDK usage (native, Traceloop-free)"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_openai", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.3.0"
respan-sdk = ">=2.6.0"
# Optional: the instrumentor lazy-imports openai and no-ops when it is absent, so
# the app brings its own openai. Install with the SDK via the `instruments` extra.
openai = { version = ">=1.0.0", optional = true }

[tool.poetry.extras]
instruments = ["openai"]

[tool.poetry.plugins."respan.instrumentations"]
openai = "respan_instrumentation_openai:OpenAIInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
