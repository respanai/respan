[tool.poetry]
name = "respan-instrumentation-ollama"
version = "0.1.0"
description = "Respan instrumentation plugin for Ollama"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_ollama", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.6.26"
# Optional: the instrumentor lazy-imports ollama and no-ops when it is absent, so
# the app brings its own ollama. Install with the SDK via the `instruments` extra.
ollama = { version = ">=0.6.0", optional = true }
opentelemetry-semantic-conventions-ai = ">=0.4.1"

[tool.poetry.extras]
instruments = ["ollama"]

[tool.poetry.plugins."respan.instrumentations"]
ollama = "respan_instrumentation_ollama:OllamaInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
