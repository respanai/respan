[tool.poetry]
name = "respan-instrumentation-lancedb"
version = "0.1.0"
description = "Respan instrumentation plugin for LanceDB"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_lancedb", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.6.1"
lancedb = ">=0.20.0,<1.0.0"
opentelemetry-semantic-conventions-ai = ">=0.4.1"
wrapt = ">=1.16.0"

[tool.poetry.plugins."respan.instrumentations"]
lancedb = "respan_instrumentation_lancedb:LanceDBInstrumentor"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
