[tool.poetry]
name = "respan-instrumentation-autogen"
version = "0.1.1"
description = "Respan instrumentation plugin for AutoGen AgentChat and legacy autogen"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_autogen", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.16.1"
respan-sdk = ">=2.5.0"
respan-instrumentation-openinference = ">=1.2.5"
autogen-agentchat = ">=0.5.1,<0.8"
autogen-ext = { version = ">=0.5.1,<0.8", extras = ["openai"] }
openinference-instrumentation-autogen-agentchat = ">=0.1.21,<0.2"
openinference-instrumentation-ag2 = ">=0.1.6,<0.2"
pyautogen = { version = ">=0.2.2,<0.3", optional = true }
autogen = { version = ">=0.7,<0.8", optional = true }

[tool.poetry.extras]
legacy-pyautogen = ["pyautogen"]
legacy-autogen = ["autogen"]

[tool.poetry.plugins."respan.instrumentations"]
autogen = "respan_instrumentation_autogen:AutoGenInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
