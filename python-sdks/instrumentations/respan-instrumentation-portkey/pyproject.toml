[tool.poetry]
name = "respan-instrumentation-portkey"
version = "0.1.0"
description = "Respan instrumentation plugin for Portkey"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_portkey", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.16.1"
respan-sdk = ">=2.5.0"
respan-instrumentation-openinference = ">=1.2.2"
portkey-ai = ">=2.3.1"
openinference-instrumentation-portkey = ">=0.1.11"
opentelemetry-semantic-conventions-ai = ">=0.4.1"

[tool.poetry.plugins."respan.instrumentations"]
portkey = "respan_instrumentation_portkey:PortkeyInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
