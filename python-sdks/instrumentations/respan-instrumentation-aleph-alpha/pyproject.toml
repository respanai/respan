[tool.poetry]
name = "respan-instrumentation-aleph-alpha"
version = "0.1.0"
description = "Respan instrumentation plugin for Aleph Alpha"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_aleph_alpha", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.6.1"
aleph-alpha-client = ">=11.5.0"
opentelemetry-semantic-conventions-ai = ">=0.5.1"

[tool.poetry.plugins."respan.instrumentations"]
aleph-alpha = "respan_instrumentation_aleph_alpha:AlephAlphaInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
