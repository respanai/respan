[tool.poetry]
name = "respan-instrumentation-instructor"
version = "0.1.0"
description = "Respan instrumentation plugin for Instructor"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_instructor", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-sdk = ">=2.7.6"
instructor = ">=1.3.7"
opentelemetry-semantic-conventions-ai = ">=0.5.1,<0.6"
opentelemetry-semantic-conventions = ">=0.59b0"

[tool.poetry.plugins."respan.instrumentations"]
instructor = "respan_instrumentation_instructor:InstructorInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
