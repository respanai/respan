[tool.poetry]
name = "respan-instrumentation-guardrails"
version = "0.1.0"
description = "Respan instrumentation plugin for Guardrails AI"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_guardrails", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.20.1"
respan-sdk = ">=2.5.0"
guardrails-ai = ">=0.9.3,<0.12.0"
opentelemetry-api = ">=1.29.0"
opentelemetry-semantic-conventions = ">=0.50b0"
openinference-semantic-conventions = ">=0.1.21"
opentelemetry-semantic-conventions-ai = ">=0.4.1"

[tool.poetry.plugins."respan.instrumentations"]
guardrails = "respan_instrumentation_guardrails:GuardrailsInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
