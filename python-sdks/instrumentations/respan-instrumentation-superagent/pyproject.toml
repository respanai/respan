[tool.poetry]
name = "respan-instrumentation-superagent"
version = "0.1.0"
description = "Respan instrumentation plugin for Superagent safety-agent"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_superagent", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.20.0"
opentelemetry-semantic-conventions = ">=0.59b0"
respan-sdk = ">=2.7.6"
safety-agent = ">=0.1.5,<1.0.0"
opentelemetry-semantic-conventions-ai = ">=0.5.1,<0.6.0"

[tool.poetry.plugins."respan.instrumentations"]
superagent = "respan_instrumentation_superagent:SuperagentInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
