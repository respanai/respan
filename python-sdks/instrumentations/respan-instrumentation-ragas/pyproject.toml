[tool.poetry]
name = "respan-instrumentation-ragas"
version = "0.1.0"
description = "Respan instrumentation plugin for Ragas evaluations and experiments"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_ragas", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
ragas = ">=0.4.3,<0.5.0"
langchain-community = ">=0.3.0,<0.4.0"
opentelemetry-api = ">=1.38.0,<2.0.0"
opentelemetry-semantic-conventions-ai = ">=0.4.1"
respan-sdk = ">=2.6.1"
respan-tracing = "^2.17.0"

[tool.poetry.plugins."respan.instrumentations"]
ragas = "respan_instrumentation_ragas:RagasInstrumentor"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
