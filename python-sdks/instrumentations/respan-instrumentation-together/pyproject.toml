[tool.poetry]
name = "respan-instrumentation-together"
version = "0.1.0"
description = "Respan instrumentation plugin for the Together AI Python SDK"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_together", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = ">=2.17.0"
respan-sdk = ">=2.6.1"
# Optional: the instrumentor lazy-imports together and no-ops when it is absent, so
# the app brings its own together. Install with the SDK via the `instruments` extra.
together = { version = ">=2.0.0", optional = true }
opentelemetry-semantic-conventions-ai = ">=0.5.1"

[tool.poetry.extras]
instruments = ["together"]

[tool.poetry.plugins."respan.instrumentations"]
together = "respan_instrumentation_together:TogetherInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
