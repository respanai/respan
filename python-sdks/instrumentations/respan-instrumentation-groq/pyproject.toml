[tool.poetry]
name = "respan-instrumentation-groq"
version = "0.1.0"
description = "Respan instrumentation plugin for Groq"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_groq", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.17.0"
respan-instrumentation-openinference = ">=1.2.2"
groq = ">=0.9.0"
openinference-instrumentation-groq = ">=0.1.0"

[tool.poetry.plugins."respan.instrumentations"]
groq = "respan_instrumentation_groq:GroqInstrumentor"

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
