[tool.poetry]
name = "respan-instrumentation-openinference"
version = "1.2.2"
description = "Respan instrumentation wrapper for OpenInference"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_openinference", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
respan-tracing = "^2.16.1"
respan-sdk = ">=2.7.6,<3.0.0"
opentelemetry-semantic-conventions = ">=0.59b0,<1.0.0"
openinference-semantic-conventions = ">=0.1.32,<0.2.0"
opentelemetry-semantic-conventions-ai = ">=0.5.1,<0.6.0"
# Users install individual OpenInference packages as needed, e.g.:
#   pip install openinference-instrumentation-google-adk

[tool.pytest.ini_options]
markers = [
    "integration: live network tests (requires API keys)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
