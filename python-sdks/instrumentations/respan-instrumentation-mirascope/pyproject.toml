[tool.poetry]
name = "respan-instrumentation-mirascope"
version = "0.1.0"
description = "Respan instrumentation plugin for Mirascope 2.x"
authors = ["Respan <team@respan.ai>"]
license = "Apache 2.0"
readme = "README.md"
packages = [
    { include = "respan_instrumentation_mirascope", from = "./src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
mirascope = ">=2.5.0,<3.0.0"
opentelemetry-api = ">=1.38.0,<2.0.0"
opentelemetry-semantic-conventions-ai = ">=0.4.1"
respan-sdk = ">=2.6.1"
respan-tracing = "^2.17.0"

[tool.poetry.plugins."respan.instrumentations"]
mirascope = "respan_instrumentation_mirascope:MirascopeInstrumentor"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
