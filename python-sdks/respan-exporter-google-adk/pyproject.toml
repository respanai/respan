[tool.poetry]
name = "respan-exporter-google-adk"
version = "1.0.0"
description = "Respan exporter for Google ADK traces"
authors = ["Respan <team@respan.ai>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "respan_exporter_google_adk", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
requests = "^2.32.5"
wrapt = "^1.16.0"
opentelemetry-sdk = "^1.20.0"
opentelemetry-api = "^1.20.0"
opentelemetry-instrumentation = "^0.41b0"
respan-sdk = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
google-adk = ">=1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
