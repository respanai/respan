name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      base_ref: ${{ steps.refs.outputs.base_ref }}
      head_ref: ${{ steps.refs.outputs.head_ref }}
      javascript_matrix: ${{ steps.javascript_matrix.outputs.value }}
      javascript_count: ${{ steps.javascript_count.outputs.value }}
      python_matrix: ${{ steps.python_matrix.outputs.value }}
      python_count: ${{ steps.python_count.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: python3 scripts/release_inventory.py --validate

      - id: refs
        name: Resolve comparison refs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          DEFAULT_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_REF="${PR_BASE_SHA}"
            HEAD_REF="${PR_HEAD_SHA}"
          else
            BASE_REF="${PUSH_BASE_SHA}"
            HEAD_REF="${DEFAULT_HEAD_SHA}"
          fi

          if [ -z "${HEAD_REF}" ]; then
            HEAD_REF="${DEFAULT_HEAD_SHA}"
          fi

          if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="$(git rev-parse "${HEAD_REF}^")"
          fi

          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"

      - name: Validate release intents
        env:
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
          HEAD_REF: ${{ steps.refs.outputs.head_ref }}
        run: |
          python3 scripts/release_intents.py validate
          missing="$(python3 scripts/release_intents.py missing --changed-from "${BASE_REF}" --changed-to "${HEAD_REF}" --format names)"
          if [ -n "${missing}" ]; then
            echo "The following release-managed packages changed without a release intent:"
            echo "${missing}"
            exit 1
          fi

      - id: javascript_matrix
        name: Build JavaScript matrix
        env:
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
          HEAD_REF: ${{ steps.refs.outputs.head_ref }}
        run: echo "value=$(python3 scripts/release_inventory.py --ecosystem javascript --changed-from "${BASE_REF}" --changed-to "${HEAD_REF}" --include-dependents --format github-matrix)" >> "$GITHUB_OUTPUT"

      - id: javascript_count
        name: Count JavaScript packages
        env:
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
          HEAD_REF: ${{ steps.refs.outputs.head_ref }}
        run: echo "value=$(python3 scripts/release_inventory.py --ecosystem javascript --changed-from "${BASE_REF}" --changed-to "${HEAD_REF}" --include-dependents --count)" >> "$GITHUB_OUTPUT"

      - id: python_matrix
        name: Build Python matrix
        env:
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
          HEAD_REF: ${{ steps.refs.outputs.head_ref }}
        run: echo "value=$(python3 scripts/release_inventory.py --ecosystem python --changed-from "${BASE_REF}" --changed-to "${HEAD_REF}" --include-dependents --format github-matrix)" >> "$GITHUB_OUTPUT"

      - id: python_count
        name: Count Python packages
        env:
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
          HEAD_REF: ${{ steps.refs.outputs.head_ref }}
        run: echo "value=$(python3 scripts/release_inventory.py --ecosystem python --changed-from "${BASE_REF}" --changed-to "${HEAD_REF}" --include-dependents --count)" >> "$GITHUB_OUTPUT"

  javascript:
    needs: discover
    if: ${{ needs.discover.outputs.javascript_count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.javascript_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install and run package checks
        run: |
          corepack enable
          cd javascript-sdks
          yarn install
          if [ "${{ matrix.has_build }}" = "true" ]; then
            python3 ../scripts/release_inventory.py --build-order-for "${{ matrix.name }}" --format paths | while IFS= read -r package_path; do
              [ -n "${package_path}" ] || continue
              if [ "${package_path}" = "javascript-sdks/respan-cli" ]; then
                yarn workspace "@respan/cli" run build
              else
                ./node_modules/.bin/tsc -p "../${package_path}/tsconfig.json"
              fi
            done
          fi
          if [ "${{ matrix.has_test }}" = "true" ]; then
            # Bypass `yarn workspace ... test` and `yarn run test` because
            # Yarn 4 hardened mode (active on public-fork PRs) doesn't
            # persist the install-state file that those commands rely on.
            # `npm test` reads scripts from package.json directly and walks
            # parents to find node_modules/.bin (populated by yarn install
            # with nodeLinker: node-modules).
            (cd "../${{ matrix.path }}" && npm test)
          fi

      - name: Package smoke check
        working-directory: ${{ matrix.path }}
        run: npm pack --dry-run

  python:
    needs: discover
    if: ${{ needs.discover.outputs.python_count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.python_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build tooling
        run: python3 -m pip install --upgrade build pip

      - name: Build distribution
        working-directory: ${{ matrix.path }}
        run: python3 -m build

      - name: Install smoke check
        if: ${{ matrix.import_name != null }}
        working-directory: ${{ matrix.path }}
        env:
          IMPORT_NAME: ${{ matrix.import_name }}
          DIST_NAME: ${{ matrix.name }}
        run: |
          python3 -m venv .ci-smoke-venv
          . .ci-smoke-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          import importlib.metadata
          import importlib.util
          import os

          if importlib.util.find_spec(os.environ["IMPORT_NAME"]) is None:
              raise ModuleNotFoundError(os.environ["IMPORT_NAME"])
          importlib.metadata.version(os.environ["DIST_NAME"])
          PY

      # A1: respan-ai bundles the native respan-instrumentation-* plugins so a bare
      # Respan() auto-traces the direct LLM SDKs. The provider SDKs are optional
      # (the app brings them), so this asserts the instrumentors are bundled with no
      # SDK leakage, then installs openai and asserts that instrumentor actually traces.
      - name: respan-ai auto-instrument smoke check
        if: ${{ matrix.name == 'respan-ai' }}
        working-directory: ${{ matrix.path }}
        env:
          RESPAN_API_KEY: ci-test-key
        run: |
          python3 -m venv .ci-autoinstrument-venv
          . .ci-autoinstrument-venv/bin/activate
          python -m pip install --upgrade pip
          # Install the bundled native instrumentors from local source (this PR makes
          # their provider SDKs optional; the published versions don't yet). Installed
          # with deps, so respan-tracing + OTEL come along but the provider SDKs
          # (openai, boto3, ...) must NOT.
          python -m pip install \
            ../instrumentations/respan-instrumentation-openai \
            ../instrumentations/respan-instrumentation-anthropic \
            ../instrumentations/respan-instrumentation-aws-bedrock \
            ../instrumentations/respan-instrumentation-vertexai \
            ../instrumentations/respan-instrumentation-google-genai \
            ../instrumentations/respan-instrumentation-together \
            ../instrumentations/respan-instrumentation-ollama
          # respan-ai's floors point at the first optional-SDK releases (e.g.
          # anthropic >=1.0.2), which aren't published yet and are newer than the
          # local source installed above, so a normal resolve of respan-ai's deps
          # would fail (ResolutionImpossible). Install it --no-deps: the instrumentors
          # it bundles are already present from source, and the floors are validated
          # against real releases post-publish, not against local working copies.
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          import importlib.metadata as md
          import importlib.util

          # 1. All native instrumentors are bundled / discoverable.
          expected = {"openai", "anthropic", "aws-bedrock", "vertexai", "google-genai", "together", "ollama"}
          discovered = {ep.name for ep in md.entry_points(group="respan.instrumentations")}
          missing = expected - discovered
          assert not missing, f"native instrumentors not bundled: {sorted(missing)}"

          # 2. No provider SDK leaked in (they are optional, brought by the app).
          def _installed(module):
              try:
                  return importlib.util.find_spec(module) is not None
              except Exception:
                  return False
          leaked = [
              m for m in ("openai", "anthropic", "botocore", "vertexai", "google.genai", "together", "ollama")
              if _installed(m)
          ]
          assert not leaked, f"provider SDKs must not be installed by respan-ai: {leaked}"
          print("OK: instrumentors bundled, no provider SDK leaked")
          PY
          # 3. Install one provider SDK and assert that instrumentor actually traces.
          python -m pip install openai
          python - <<'PY'
          import os
          os.environ.setdefault("RESPAN_API_KEY", "ci-test-key")

          from respan import Respan
          from opentelemetry import trace
          from opentelemetry.sdk.trace.export import SimpleSpanProcessor
          from opentelemetry.sdk.trace.export.in_memory_span_exporter import (
              InMemorySpanExporter,
          )

          Respan(is_batching_enabled=False)
          mem = InMemorySpanExporter()
          trace.get_tracer_provider().add_span_processor(SimpleSpanProcessor(mem))

          import openai
          try:
              openai.OpenAI(
                  api_key="x", base_url="http://127.0.0.1:1/v1", max_retries=0
              ).chat.completions.create(
                  model="gpt-4o-mini", messages=[{"role": "user", "content": "hi"}]
              )
          except Exception:
              pass

          names = [s.name for s in mem.get_finished_spans()]
          assert any("openai" in n or "chat" in n.lower() for n in names), (
              f"openai not instrumented after install; spans={names}"
          )
          print("OK: openai instrumented after install ->", names)
          PY
