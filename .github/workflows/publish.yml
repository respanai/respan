name: Publish

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_ref:
        description: Optional git ref or SHA to compare from
        required: false
      head_ref:
        description: Optional git ref or SHA to compare to
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      base_ref: ${{ steps.refs.outputs.base_ref }}
      head_ref: ${{ steps.refs.outputs.head_ref }}
      javascript_plan: ${{ steps.javascript_plan.outputs.value }}
      javascript_count: ${{ steps.javascript_count.outputs.value }}
      javascript_versions: ${{ steps.javascript_versions.outputs.value }}
      python_matrix: ${{ steps.python_matrix.outputs.value }}
      python_count: ${{ steps.python_count.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.head_ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: |
          python3 scripts/release_inventory.py --validate
          python3 scripts/release_intents.py validate

      - id: refs
        name: Resolve comparison refs
        env:
          DISPATCH_BASE_REF: ${{ inputs.base_ref }}
          DISPATCH_HEAD_REF: ${{ inputs.head_ref }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            HEAD_REF="${WORKFLOW_RUN_HEAD_SHA}"
            BASE_REF="$(git rev-parse "${HEAD_REF}^")"
          else
            BASE_REF="${DISPATCH_BASE_REF}"
            HEAD_REF="${DISPATCH_HEAD_REF}"
            if [ -z "${HEAD_REF}" ]; then
              HEAD_REF="${DEFAULT_HEAD_SHA}"
            fi
            if [ -z "${BASE_REF}" ]; then
              BASE_REF="$(git rev-parse "${HEAD_REF}^")"
            fi
          fi

          if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="$(git rev-parse "${HEAD_REF}^")"
          fi

          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"

      - id: javascript_plan
        name: Build JavaScript publication plan
        env:
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
          HEAD_REF: ${{ steps.refs.outputs.head_ref }}
        run: |
          echo "value=$(python3 scripts/release_intents.py plan --ecosystem javascript --changed-from "${BASE_REF}" --changed-to "${HEAD_REF}" --format github-matrix)" >> "$GITHUB_OUTPUT"

      - id: javascript_count
        name: Count JavaScript publish packages
        env:
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
          HEAD_REF: ${{ steps.refs.outputs.head_ref }}
        run: |
          echo "value=$(python3 scripts/release_intents.py plan --ecosystem javascript --changed-from "${BASE_REF}" --changed-to "${HEAD_REF}" --count)" >> "$GITHUB_OUTPUT"

      - id: javascript_versions
        name: Resolve JavaScript release versions
        env:
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
          HEAD_REF: ${{ steps.refs.outputs.head_ref }}
        run: |
          VERSIONS="$(python3 scripts/release_intents.py resolve-versions --ecosystem javascript --changed-from "${BASE_REF}" --changed-to "${HEAD_REF}" --prefer-registry)"
          echo "value=${VERSIONS}" >> "$GITHUB_OUTPUT"

      - id: python_matrix
        name: Build Python publish matrix
        env:
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
          HEAD_REF: ${{ steps.refs.outputs.head_ref }}
        run: |
          echo "value=$(python3 scripts/release_intents.py plan --ecosystem python --changed-from "${BASE_REF}" --changed-to "${HEAD_REF}" --format github-matrix)" >> "$GITHUB_OUTPUT"

      - id: python_count
        name: Count Python publish packages
        env:
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
          HEAD_REF: ${{ steps.refs.outputs.head_ref }}
        run: |
          echo "value=$(python3 scripts/release_intents.py plan --ecosystem python --changed-from "${BASE_REF}" --changed-to "${HEAD_REF}" --count)" >> "$GITHUB_OUTPUT"

  publish-javascript:
    needs: discover
    if: ${{ needs.discover.outputs.javascript_count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Prepare coordinated JavaScript publication
        env:
          JAVASCRIPT_PLAN: ${{ needs.discover.outputs.javascript_plan }}
          JAVASCRIPT_VERSIONS: ${{ needs.discover.outputs.javascript_versions }}
        run: |
          mkdir -p .release-sync
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(os.environ["JAVASCRIPT_PLAN"])
          Path(".release-sync/javascript-plan.json").write_text(
              json.dumps(plan, indent=2) + "\n"
          )
          PY

          python3 scripts/release_intents.py apply-resolved-versions \
            --versions-json "${JAVASCRIPT_VERSIONS}" \
            --plan-file .release-sync/javascript-plan.json
          python3 scripts/release_inventory.py \
            --javascript-build-order-file .release-sync/javascript-plan.json \
            --format json > .release-sync/javascript-build-order.json
          python3 scripts/release_inventory.py \
            --javascript-publish-order-file .release-sync/javascript-plan.json \
            --format json > .release-sync/javascript-publish-order.json

          corepack enable
          cd javascript-sdks
          yarn install

      - name: Build all planned JavaScript packages
        run: |
          cd javascript-sdks
          while IFS= read -r package_name; do
            [ -n "${package_name}" ] || continue
            yarn workspace "${package_name}" run build
          done < <(jq -r '.[] | select(.has_build == true) | .name' \
            "${GITHUB_WORKSPACE}/.release-sync/javascript-build-order.json")

      - name: Pack all planned JavaScript packages
        run: |
          while IFS='|' read -r package_path package_slug; do
            [ -n "${package_path}" ] || continue
            (
              cd "${package_path}"
              yarn pack --out "${RUNNER_TEMP}/${package_slug}.tgz"
            )
          done < <(jq -r '.[] | [.path, .slug] | join("|")' \
            .release-sync/javascript-publish-order.json)

      - name: Publish and smoke JavaScript packages in dependency order
        run: |
          while IFS='|' read -r package_name package_version package_slug bin_name has_peer_dependencies; do
            [ -n "${package_name}" ] || continue
            npm publish "${RUNNER_TEMP}/${package_slug}.tgz" --access public

            smoke_dir="$(mktemp -d)"
            (
              cd "${smoke_dir}"
              npm init -y >/dev/null 2>&1

              for attempt in {1..16}; do
                if npm view "${package_name}@${package_version}" version >npm-view.log 2>&1; then
                  break
                fi
                if [ "${attempt}" -eq 16 ]; then
                  cat npm-view.log
                  exit 1
                fi
                sleep 15
              done

              for attempt in {1..10}; do
                if npm install --prefer-online "${package_name}@${package_version}" >npm-install.log 2>&1; then
                  break
                fi
                if [ "${attempt}" -eq 10 ]; then
                  cat npm-install.log
                  exit 1
                fi
                sleep 15
              done

              if [ -n "${bin_name}" ]; then
                "./node_modules/.bin/${bin_name}" --help >/dev/null
              elif [ "${has_peer_dependencies}" = "true" ]; then
                echo "Skipping empty-project import smoke for ${package_name} because it declares peer dependencies."
              else
                PACKAGE_NAME="${package_name}" node --input-type=module \
                  -e "await import(process.env.PACKAGE_NAME)"
              fi
            )
          done < <(jq -r '.[] | [
              .name,
              .version,
              .slug,
              (.bin_name // ""),
              (if .has_peer_dependencies then "true" else "false" end)
            ] | join("|")' .release-sync/javascript-publish-order.json)

      - name: Record all published JavaScript versions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          records = json.loads(
              Path(".release-sync/javascript-publish-order.json").read_text()
          )
          versions = {record["name"]: record["version"] for record in records}
          Path(".release-sync/versions.json").write_text(
              json.dumps(versions, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload published JavaScript versions artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-versions-javascript
          path: .release-sync/versions.json
          if-no-files-found: error

  build-python:
    needs: discover
    if: ${{ needs.discover.outputs.python_count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.python_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version || '3.11' }}

      - name: Install Python build tooling
        run: python3 -m pip install --upgrade build pip

      - name: Build distribution
        working-directory: ${{ matrix.path }}
        run: |
          RELEASE_VERSION="$(python3 "${GITHUB_WORKSPACE}/scripts/release_intents.py" apply --package "${{ matrix.name }}" --bump "${{ matrix.bump }}" --prefer-registry)"
          echo "${RELEASE_VERSION}" > dist.release-version
          python3 -m build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.slug }}
          path: ${{ matrix.path }}/dist/*
          if-no-files-found: error

      - name: Upload release version artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-version-${{ matrix.slug }}
          path: ${{ matrix.path }}/dist.release-version
          if-no-files-found: error

  publish-python:
    needs:
      - discover
      - build-python
    if: ${{ needs.discover.outputs.python_count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.python_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version || '3.11' }}

      - name: Download distribution artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-${{ matrix.slug }}
          path: dist

      - name: Download release version artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-version-${{ matrix.slug }}
          path: version

      - id: release_version
        name: Read release version
        run: echo "value=$(cat version/dist.release-version)" >> "$GITHUB_OUTPUT"

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.14.2

      - name: Registry smoke test
        if: ${{ matrix.import_name != null }}
        env:
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_VERSION: ${{ steps.release_version.outputs.value }}
          IMPORT_NAME: ${{ matrix.import_name }}
        run: |
          python -m venv .smoke-venv
          . .smoke-venv/bin/activate
          python -m pip install --upgrade pip

          for attempt in {1..40}; do
            if python -m pip install --no-cache-dir "${PACKAGE_NAME}==${PACKAGE_VERSION}" >/tmp/pip-install.log 2>&1; then
              break
            fi
            if [ "${attempt}" -eq 40 ]; then
              cat /tmp/pip-install.log
              exit 1
            fi
            sleep 15
          done

          python - <<'PY'
          import importlib
          import os

          importlib.import_module(os.environ["IMPORT_NAME"])
          PY

      - name: Record published version
        run: |
          mkdir -p .release-sync
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "name": os.environ["PACKAGE_NAME"],
              "version": os.environ["PACKAGE_VERSION"],
          }
          Path(".release-sync/version.json").write_text(json.dumps(payload) + "\n")
          PY
        env:
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_VERSION: ${{ steps.release_version.outputs.value }}

      - name: Upload published version artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-version-python-${{ matrix.slug }}
          path: .release-sync/version.json
          if-no-files-found: error

  sync-manifest-versions:
    needs:
      - discover
      - publish-javascript
      - publish-python
    if: ${{ always() && (needs.discover.outputs.javascript_count != '0' || needs.discover.outputs.python_count != '0') && needs.discover.result == 'success' && (needs.publish-javascript.result == 'success' || needs.publish-javascript.result == 'skipped') && (needs.publish-python.result == 'success' || needs.publish-python.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download published version artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: published-version*
          path: .release-sync/artifacts
          merge-multiple: false

      - name: Build version mapping
        run: |
          python3 scripts/release_intents.py merge-version-artifacts \
            --artifact-root .release-sync/artifacts \
            --output .release-sync/versions.json

      - name: Sync manifest versions
        run: |
          python3 scripts/release_intents.py set-versions --file .release-sync/versions.json

      - name: Commit synced versions
        run: |
          if git diff --quiet --exit-code; then
            echo "No manifest changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add javascript-sdks python-sdks
          git commit -m "chore: sync published package versions [skip ci]"
          git push origin HEAD:main
